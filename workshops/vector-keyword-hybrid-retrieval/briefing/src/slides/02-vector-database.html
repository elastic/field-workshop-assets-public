<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Elasticsearch is a Vector Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 720px; overflow: hidden; -webkit-font-smoothing: antialiased; }
    body { background: #0a0e16; font-family: "Inter", sans-serif; position: relative; color: #fff; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(ellipse 900px 600px at 50% 50%, rgba(0,191,179,0.1) 0%, transparent 70%),
        radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: auto, 32px 32px;
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

    .slide { width: 1280px; height: 720px; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }


    .statement { text-align: center; margin-top: 22px; opacity: 0; animation: scale-in 0.6s ease forwards 0.18s; }
    .statement .word-elastic { font-size: 72px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; display: block; }
    .statement .word-is { font-size: 72px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; display: block; color: rgba(255,255,255,0.55); }
    .statement .word-a { font-size: 72px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; display: block; color: rgba(255,255,255,0.55); }
    .statement .word-vdb { font-size: 72px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; display: block; color: #6fe9da; }

    /* Inline version */
    .hero { font-size: 72px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; text-align: center; opacity: 0; animation: scale-in 0.6s ease forwards 0.18s; max-width: 980px; }
    .hero em { font-style: normal; color: #6fe9da; white-space: nowrap; }
    .hero .thin { font-weight: 300; color: rgba(255,255,255,0.55); }

    .pills { display: flex; gap: 14px; margin-top: 44px; opacity: 0; animation: fade-up 0.5s ease forwards 0.5s; }
    .pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); border-radius: 32px; padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
    .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .pill:nth-child(1) .pill-dot { background: #6fe9da; }
    .pill:nth-child(2) .pill-dot { background: #fec514; }
    .pill:nth-child(3) .pill-dot { background: #93c90e; }
    .pill-text { font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.9); }

    .footnote { margin-top: 30px; font-size: 20px; font-weight: 400; color: rgba(255,255,255,0.6); opacity: 0; animation: fade-up 0.5s ease forwards 0.65s; }
    .footnote b { color: #6fe9da; font-weight: 600; }
    .elastic-logo { position: absolute; bottom: 30px; left: 64px; display: flex; align-items: center; gap: 9px; opacity: 0; animation: fade-up 0.5s ease forwards 0.7s; }
    .elastic-logo .name { font-weight: 600; font-size: 17px; color: rgba(255,255,255,0.92); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="hero">Elasticsearch<br><span class="thin">is a</span><br><em>Vector Database</em></div>

    <div class="pills">
      <div class="pill"><div class="pill-dot"></div><div class="pill-text">Lexical + vector in one engine</div></div>
      <div class="pill"><div class="pill-dot"></div><div class="pill-text">Embeddings run in-cluster (EIS)</div></div>
      <div class="pill"><div class="pill-dot"></div><div class="pill-text">Scales past RAM (BBQ &middot; DiskBBQ)</div></div>
    </div>

    <div class="footnote">Today you'll use all three &mdash; <b>without configuring any of it.</b></div>

    <div class="elastic-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="Elastic"><path d="M32 16.77c0-2.678-1.664-5.03-4.166-5.937a9.14 9.14 0 0 0 .162-1.718c0-5-4.057-9.048-9.035-9.048-2.92 0-5.626 1.393-7.33 3.746a4.78 4.78 0 0 0-2.935-1c-2.65 0-4.8 2.15-4.8 4.8 0 .582.108 1.15.298 1.677A6.36 6.36 0 0 0 0 15.243a6.31 6.31 0 0 0 4.179 5.951 9.02 9.02 0 0 0-.162 1.718 9.03 9.03 0 0 0 9.021 9.021c2.92 0 5.626-1.407 7.317-3.76.84.663 1.866 1.028 2.935 1.028 2.65 0 4.8-2.15 4.8-4.8 0-.582-.108-1.15-.298-1.677A6.37 6.37 0 0 0 32 16.771" fill="#fff"/><path d="M12.578 13.795l7.006 3.192 7.06-6.194a7.4 7.4 0 0 0 .149-1.555 7.91 7.91 0 0 0-7.899-7.899 7.89 7.89 0 0 0-6.505 3.435l-1.177 6.1z" fill="#fed10a"/><path d="M5.33 21.207a7.66 7.66 0 0 0-.15 1.582c0 4.37 3.557 7.912 7.926 7.912a7.92 7.92 0 0 0 6.546-3.462l1.163-6.073-1.555-2.975-7.033-3.205z" fill="#24bbb1"/><path d="M5.288 9.09l4.8 1.136 1.055-5.45c-.65-.5-1.46-.77-2.3-.77A3.79 3.79 0 0 0 5.058 7.79c0 .446.08.893.23 1.298" fill="#ef5098"/><path d="M4.87 10.238c-2.137.703-3.638 2.76-3.638 5.018 0 2.205 1.366 4.166 3.408 4.95l6.735-6.086-1.23-2.637z" fill="#17a8e0"/><path d="M20.87 27.24a3.8 3.8 0 0 0 2.286.784 3.79 3.79 0 0 0 3.787-3.787 3.82 3.82 0 0 0-.23-1.312l-4.788-1.123z" fill="#93c83e"/><path d="M21.843 20.544l5.275 1.23a5.33 5.33 0 0 0 3.638-5.031 5.29 5.29 0 0 0-3.408-4.937l-6.898 6.046z" fill="#0779a1"/></svg>
      <span class="name">elastic</span>
    </div>
  </div>
  <script>'use strict';

// Slides list is injected by the server as window.FUCKSLIDES_SLIDES
// Falls back to a single-slide no-op so slides still work opened directly
const SLIDES = window.FUCKSLIDES_SLIDES || [window.location.pathname.split('/').pop() || 'index.html'];

function currentSlideIndex() {
  const file = window.location.pathname.split('/').pop() || SLIDES[0];
  const idx  = SLIDES.indexOf(file);
  return idx === -1 ? 0 : idx;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

function saveFs() {
  if (document.fullscreenElement) sessionStorage.setItem('fs-fs', '1');
}

const inPlayer = window !== window.top;

if (inPlayer) {
  document.addEventListener('keydown', e => {
    window.parent.postMessage({ type: 'keydown', key: e.key }, '*');
  });
}

if (!inPlayer) {
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const idx = currentSlideIndex();
    if ((e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') && idx < SLIDES.length - 1) {
      e.preventDefault(); saveFs(); window.location.href = SLIDES[idx + 1];
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && idx > 0) {
      e.preventDefault(); saveFs(); window.location.href = SLIDES[idx - 1];
    }
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });
}

function injectNav() {
  const style = document.createElement('style');
  style.textContent = `
    .fs-nav { position:fixed; bottom:1.5rem; right:1.5rem; display:flex; align-items:center; gap:.25rem; z-index:9999; background:rgba(34,36,44,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12); border-radius:40px; padding:.3rem .45rem; }
    .fs-nav .nav-btn { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; color:rgba(255,255,255,.7); text-decoration:none; transition:background .15s,color .15s; cursor:pointer; }
    .fs-nav .nav-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .fs-nav .nav-btn svg { width:13px; height:13px; }
    .fs-nav .nav-btn--disabled { opacity:.2; pointer-events:none; }
    .fs-nav .nav-counter { font-family:'Inter',-apple-system,sans-serif; font-size:.62rem; font-weight:600; color:rgba(255,255,255,.45); letter-spacing:.06em; padding:0 .35rem; user-select:none; }
  `;
  document.head.appendChild(style);

  const idx   = currentSlideIndex();
  const chevL = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L6 8l4 5"/></svg>`;
  const chevR = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l4 5-4 5"/></svg>`;
  const fsIco = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>`;

  const prevEl = idx > 0
    ? `<a href="${SLIDES[idx - 1]}" class="nav-btn" title="Previous (←)">${chevL}</a>`
    : `<span class="nav-btn nav-btn--disabled">${chevL}</span>`;
  const nextEl = idx < SLIDES.length - 1
    ? `<a href="${SLIDES[idx + 1]}" class="nav-btn" title="Next (→)">${chevR}</a>`
    : `<span class="nav-btn nav-btn--disabled">${chevR}</span>`;

  const nav = document.createElement('nav');
  nav.className = 'fs-nav';
  nav.innerHTML = `${prevEl}<span class="nav-counter">${idx + 1}&thinsp;/&thinsp;${SLIDES.length}</span><a href="#" id="fs-fullscreen" class="nav-btn" title="Fullscreen (F)">${fsIco}</a>${nextEl}`;
  document.body.appendChild(nav);

  document.getElementById('fs-fullscreen').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
  nav.querySelectorAll('a[href]').forEach(a => a.addEventListener('click', e => { e.stopPropagation(); saveFs(); }));
}

document.addEventListener('DOMContentLoaded', () => {
  if (inPlayer) return;
  if (sessionStorage.getItem('fs-fs')) {
    sessionStorage.removeItem('fs-fs');
    document.documentElement.requestFullscreen().catch(() => {});
  }
  injectNav();
});

// Reveal on scroll
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

// Animated stat counters
function animateCounter(el) {
  const target = parseFloat(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const prefix = el.dataset.prefix || '';
  const start  = performance.now();
  const dur    = 1400;
  function step(now) {
    const ease  = 1 - Math.pow(1 - Math.min((now - start) / dur, 1), 3);
    el.textContent = prefix + (Number.isInteger(target) ? Math.round(target * ease) : (target * ease).toFixed(1)) + suffix;
    if (ease < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const counterObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !e.target.dataset.counted) {
      e.target.dataset.counted = 'true';
      animateCounter(e.target);
    }
  });
}, { threshold: 0.5 });
document.querySelectorAll('[data-target]').forEach(el => counterObserver.observe(el));
</script>
</body>
</html>
