  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

@keyframes fade-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.sub{font-size:18px;color:rgba(255,255,255,.52);margin-top:6px;font-weight:400;opacity:0;animation:fade-up .5s ease forwards .22s;}
.mono{font-family:"JetBrains Mono",monospace;}

.btn{font-family:"Inter",sans-serif;font-size:17px;font-weight:800;color:#6fe9da;cursor:pointer;

.row{position:relative;display:flex;align-items:center;gap:12px;padding:5px 12px;height:54px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.028);overflow:hidden;transition:border-color .3s,box-shadow .3s,background .3s,opacity .4s,transform .4s}

.row .bar i{display:block;height:100%}

.c-se .rk{background:rgba(111,233,218,.9);color:#000}.c-se .sc{color:#6fe9da}

.row.dim{opacity:.35}
.row.in{opacity:0;transform:translateY(8px)}
.ph{height:300px;border:1.5px dashed rgba(255,255,255,.14);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.4;color:rgba(255,255,255,.38);padding:0 30px}
.bottom{display:flex;gap:18px;margin-top:12px;align-items:stretch}
.shape{width:480px;flex-shrink:0;padding:10px 20px;border-left:3px solid #00bfb3;border-radius:10px;background:rgba(0,0,0,.35);font-family:"JetBrains Mono",monospace;font-size:18px;line-height:1.5;display:flex;flex-direction:column;justify-content:center}
.shape .k{color:#6fe9da;font-weight:700}.shape .d{color:rgba(255,255,255,.5)}
.note{flex:1;border-radius:12px;padding:8px 18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);font-size:18px;line-height:1.35;color:rgba(255,255,255,.82);min-height:70px;display:flex;align-items:center;transition:all .3s}
.note b{color:#fff}
.note .mn{font-family:"JetBrains Mono",monospace;font-size:18px}
.note .p{color:#ef5098;font-weight:700}.note .y{color:#fec514;font-weight:700}.note .t{color:#6fe9da;font-weight:700}
</style>

<div class="slide">
  <h1>Scores don&rsquo;t mix &rarr; fuse by <em>rank</em></h1>
  <div class="qrow"><div class="qchip"><span class="lbl">Query</span><span class="qt" id="qt"></span></div></div>
  <div class="btns"><span class="lbl">Combine the two lists</span>
    <button class="btn y next" id="bAdd">Just add them</button>
    <button class="btn p" id="bRrf">RRF: 1/(60 + rank)</button>
    <button class="btn" id="bLin">Linear</button>
  </div>
  <div class="cols">
    <div class="col c-bm"><div class="chead"><span class="ct" style="color:#fec514">BM25</span><span class="cs">_score up to <span id="mxb"></span></span></div><div id="lb"></div></div>
    <div class="col c-se"><div class="chead"><span class="ct" style="color:#6fe9da">Semantic</span><span class="cs">_score up to <span id="mxs"></span></span></div><div id="ls"></div></div>
    <div class="col" id="cthird"><div class="chead"><span class="ct" id="thTitle" style="color:rgba(255,255,255,.4)">Combined</span><span class="cs" id="thSub"></span></div><div id="lf"><div class="ph">Pick a way to combine<br>the two lists</div></div></div>
  </div>
  <div class="bottom">
    <div class="shape"><div><span class="k">FORK</span> ( <span class="d">&hellip; BM25 branch &hellip;</span> )</div><div style="padding-left:53px">( <span class="d">&hellip; semantic branch &hellip;</span> )</div><div><span class="k">| FUSE</span></div></div>
    <div class="note" id="note">The two lists use different scales. What happens if we just add the scores?</div>
  </div>
  <button class="replay-btn" id="reset" title="Reset">🔁</button>
</div>

<script>const Q="how do I make search results more relevant";const BM=[{"id":"doc-032","t":"Cross-cluster search","s":13.864730834960938},{"id":"doc-013","t":"Hybrid search","s":11.64763355255127},{"id":"doc-060","t":"Search after & pagination","s":11.317306518554688},{"id":"doc-026","t":"Vector search with kNN","s":8.790389060974121},{"id":"doc-016","t":"semantic_text tutorial","s":7.57051420211792}];const SEM=[{"id":"doc-059","t":"Relevance tuning & explain","s":0.7515476942062378},{"id":"doc-013","t":"Hybrid search","s":0.7387773990631104},{"id":"doc-014","t":"Retrievers","s":0.7363395690917969},{"id":"doc-026","t":"Vector search with kNN","s":0.7323927879333496},{"id":"doc-016","t":"semantic_text tutorial","s":0.7284590005874634}];const RRF=[{"id":"doc-013","t":"Hybrid search","s":0.03225806451612903},{"id":"doc-059","t":"Relevance tuning & explain","s":0.03131881575727918},{"id":"doc-060","t":"Search after & pagination","s":0.03007688828584351},{"id":"doc-026","t":"Vector search with kNN","s":0.029910714285714284},{"id":"doc-050","t":"ES|QL query language","s":0.029709507042253523}];const K=60;
const $=id=>document.getElementById(id);
$('qt').textContent='“'+Q+'”';
const mean=a=>a.reduce((x,y)=>x+y.s,0)/a.length;
const ratio=Math.round(mean(BM)/mean(SEM));
$('mxb').textContent=BM[0].s.toFixed(2); $('mxs').textContent=SEM[0].s.toFixed(3);
const rankIn=(L,id)=>{const i=L.findIndex(x=>x.id===id);return i<0?0:i+1;};
function srcRow(r,i,cls,max,col,dec){
  const d=document.createElement('div'); d.className='row '+cls; d.dataset.id=r.id;
  d.innerHTML=`<div class="rk">${i+1}</div><div class="mid"><div class="tt">${r.t}</div><div class="sb">${r.id}</div></div><div class="sc">${r.s.toFixed(dec)}</div><div class="bar" style="width:${r.s/max*100}%;background:${col}"></div>`;
  return d;
}
BM.forEach((r,i)=>$('lb').appendChild(srcRow(r,i,'c-bm',BM[0].s,'#fec514',2)));
SEM.forEach((r,i)=>$('ls').appendChild(srcRow(r,i,'c-se',SEM[0].s,'#6fe9da',3)));
const lf=$('lf'); let mode=null;
function clearHl(){document.querySelectorAll('.row.hl').forEach(e=>e.classList.remove('hl'));}
function setThird(title,color,sub,els){
  $('thTitle').textContent=title; $('thTitle').style.color=color; $('thSub').textContent=sub;
  lf.innerHTML=''; els.forEach((e,i)=>{lf.appendChild(e); if(e.classList.contains('row')){e.classList.add('in'); setTimeout(()=>e.classList.remove('in'),80+i*130);}});
  lf.firstChild&&(lf.style.display='flex'); lf.style.flexDirection='column'; lf.style.gap='6px';
}
function setBtn(active){['bAdd','bRrf','bLin'].forEach(i=>{$(i).classList.remove('next');});}
$('bAdd').onclick=()=>{
  mode='add'; clearHl(); setBtn();
  const sum={}; BM.forEach(r=>{sum[r.id]=sum[r.id]||{t:r.t,id:r.id,b:0,s:0};sum[r.id].b=r.s;});
  SEM.forEach(r=>{sum[r.id]=sum[r.id]||{t:r.t,id:r.id,b:0,s:0};sum[r.id].s=r.s;});
  const arr=Object.values(sum).map(x=>({...x,tot:x.b+x.s})).sort((a,b)=>b.tot-a.tot).slice(0,5);
  const max=arr[0].tot;
  const els=arr.map((x,i)=>{const d=document.createElement('div'); d.className='row c-ad'; d.dataset.id=x.id;
    d.innerHTML=`<div class="rk">${i+1}</div><div class="mid"><div class="tt">${x.t}</div><div class="sb">${x.b?x.b.toFixed(2):'absent'} + ${x.s?x.s.toFixed(2):'absent'}</div></div><div class="sc">${x.tot.toFixed(2)}</div><div class="bar" style="width:${x.tot/max*100}%"><i style="width:${x.b/x.tot*100}%;background:#fec514"></i><i style="width:${x.s/x.tot*100}%;background:#6fe9da"></i></div>`; return d;});
  setThird('Added scores','#fff','BM25 + semantic',els);
  const bmOrder=BM.map(r=>r.id).join(), addOrder=arr.map(r=>r.id).join();
  const drop=SEM[0];
  $('note').innerHTML=`<div>BM25 scores run <b>~${ratio}&times; bigger</b>, so the sum is just the <span class="y">BM25 order</span>. Semantic&rsquo;s #1, <b>${drop.t}</b>, falls off the list.</div>`;
  $('bRrf').classList.add('next');
};
$('bRrf').onclick=()=>{
  mode='rrf'; clearHl(); setBtn();
  const els=RRF.map((r,i)=>{const rb=rankIn(BM,r.id), rs=rankIn(SEM,r.id);
    const sub=(rb?'BM25 #'+rb:'BM25 #6+')+' · vector '+(rs?'#'+rs:'#6+');
    const d=document.createElement('div'); d.className='row c-fu'+(i===0?' hl':''); d.dataset.id=r.id;
    d.innerHTML=`<div class="rk">${i+1}</div><div class="mid"><div class="tt">${r.t}</div><div class="sb">${sub}</div></div><div class="sc">${r.s.toFixed(4)}</div>`; return d;});
  setThird('RRF','#ef5098','sum of 1/(60 + rank)',els);
  const top=RRF[0], rb=rankIn(BM,top.id), rs=rankIn(SEM,top.id);
  const a=1/(K+rb), b=1/(K+rs);
  document.querySelectorAll('.col:not(#cthird) .row').forEach(e=>{ if(e.dataset.id===top.id) e.classList.add('hl'); });
  $('note').innerHTML=`<span><b>${top.t}</b> is #${rb} in BM25 and #${rs} in semantic:<br><span class="mn"><span class="y">1/(60+${rb})</span> + <span class="t">1/(60+${rs})</span> = ${a.toFixed(4)} + ${b.toFixed(4)} = <span class="p">${(a+b).toFixed(4)}</span></span></span>`;
};
$('bLin').onclick=()=>{
  mode='lin'; clearHl(); setBtn();
  const d=document.createElement('div'); d.className='ph'; d.style.cssText='flex-direction:column;gap:12px;color:rgba(255,255,255,.85);border-style:solid;border-color:rgba(0,191,179,.5);background:rgba(0,191,179,.06)';
  d.innerHTML='<div style="font-family:\'JetBrains Mono\',monospace;font-size:20px;font-weight:700;color:#6fe9da">FUSE LINEAR</div><div>Each list scaled to 0&ndash;1 (MinMax)</div><div>then weighted: you pick the weights</div><div style="color:rgba(255,255,255,.55);font-size:18px">you&rsquo;ll try it in Lab 3</div>';
  setThird('Linear','#6fe9da','weights you choose',[d]);
  $('note').innerHTML='<div>MinMax-normalize each list, then weight. <b>Powerful, brittle</b> &mdash; Lab 3.</div>';
};
$('reset').onclick=()=>{
  mode=null; clearHl(); lf.innerHTML='<div class="ph">Pick a way to combine<br>the two lists</div>'; lf.style.display='';
  $('thTitle').textContent='Combined'; $('thTitle').style.color='rgba(255,255,255,.4)'; $('thSub').textContent='';
  $('note').textContent='The two lists use different scales. What happens if we just add the scores?';
  $('bAdd').classList.add('next');
};
</script>
<script>'use strict';

// Slides list is injected by the server as window.FUCKSLIDES_SLIDES
// Falls back to a single-slide no-op so slides still work opened directly
const SLIDES = window.FUCKSLIDES_SLIDES || [window.location.pathname.split('/').pop() || 'index.html'];

function currentSlideIndex() {
  const file = window.location.pathname.split('/').pop() || SLIDES[0];
  const idx  = SLIDES.indexOf(file);
  return idx === -1 ? 0 : idx;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

function saveFs() {
  if (document.fullscreenElement) sessionStorage.setItem('fs-fs', '1');
}

const inPlayer = window !== window.top;

if (inPlayer) {
  document.addEventListener('keydown', e => {
    window.parent.postMessage({ type: 'keydown', key: e.key }, '*');
  });
}

if (!inPlayer) {
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const idx = currentSlideIndex();
    if ((e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') && idx < SLIDES.length - 1) {
      e.preventDefault(); saveFs(); window.location.href = SLIDES[idx + 1];
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && idx > 0) {
      e.preventDefault(); saveFs(); window.location.href = SLIDES[idx - 1];
    }
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });
}

function injectNav() {
  const style = document.createElement('style');
  style.textContent = `
    .fs-nav { position:fixed; bottom:1.5rem; right:1.5rem; display:flex; align-items:center; gap:.25rem; z-index:9999; background:rgba(34,36,44,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12); border-radius:40px; padding:.3rem .45rem; }
    .fs-nav .nav-btn { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; color:rgba(255,255,255,.7); text-decoration:none; transition:background .15s,color .15s; cursor:pointer; }
    .fs-nav .nav-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .fs-nav .nav-btn svg { width:13px; height:13px; }
    .fs-nav .nav-btn--disabled { opacity:.2; pointer-events:none; }
    .fs-nav .nav-counter { font-family:'Inter',-apple-system,sans-serif; font-size:.62rem; font-weight:600; color:rgba(255,255,255,.45); letter-spacing:.06em; padding:0 .35rem; user-select:none; }
  `;
  document.head.appendChild(style);

  const idx   = currentSlideIndex();
  const chevL = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L6 8l4 5"/></svg>`;
  const chevR = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l4 5-4 5"/></svg>`;
  const fsIco = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>`;

  const prevEl = idx > 0
    ? `<a href="${SLIDES[idx - 1]}" class="nav-btn" title="Previous (←)">${chevL}</a>`
    : `<span class="nav-btn nav-btn--disabled">${chevL}</span>`;
  const nextEl = idx < SLIDES.length - 1
    ? `<a href="${SLIDES[idx + 1]}" class="nav-btn" title="Next (→)">${chevR}</a>`
    : `<span class="nav-btn nav-btn--disabled">${chevR}</span>`;

  const nav = document.createElement('nav');
  nav.className = 'fs-nav';
  nav.innerHTML = `${prevEl}<span class="nav-counter">${idx + 1}&thinsp;/&thinsp;${SLIDES.length}</span><a href="#" id="fs-fullscreen" class="nav-btn" title="Fullscreen (F)">${fsIco}</a>${nextEl}`;
  document.body.appendChild(nav);

  document.getElementById('fs-fullscreen').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
  nav.querySelectorAll('a[href]').forEach(a => a.addEventListener('click', e => { e.stopPropagation(); saveFs(); }));
}

document.addEventListener('DOMContentLoaded', () => {
  if (inPlayer) return;
  if (sessionStorage.getItem('fs-fs')) {
    sessionStorage.removeItem('fs-fs');
    document.documentElement.requestFullscreen().catch(() => {});
  }
  injectNav();
});

// Reveal on scroll
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

// Animated stat counters
function animateCounter(el) {
  const target = parseFloat(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const prefix = el.dataset.prefix || '';
  const start  = performance.now();
  const dur    = 1400;
  function step(now) {
    const ease  = 1 - Math.pow(1 - Math.min((now - start) / dur, 1), 3);
    el.textContent = prefix + (Number.isInteger(target) ? Math.round(target * ease) : (target * ease).toFixed(1)) + suffix;
    if (ease < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const counterObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !e.target.dataset.counted) {
      e.target.dataset.counted = 'true';
      animateCounter(e.target);
    }
  });
}, { threshold: 0.5 });
document.querySelectorAll('[data-target]').forEach(el => counterObserver.observe(el));
</script>
