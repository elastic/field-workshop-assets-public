<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1280"/>
    <title>Three Elasticsearch vector indexing algorithms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:1280px;height:720px;overflow:hidden;-webkit-font-smoothing:antialiased;}
    body{background:#0a0e16;font-family:"Inter",sans-serif;color:#fff;position:relative;}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:radial-gradient(rgba(255,255,255,0.022) 1px,transparent 1px);
      background-size:32px 32px;}
    @keyframes fade-up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
    @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
    @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

    .slide{width:1280px;height:720px;position:relative;z-index:1;display:flex;}

    /* ── LEFT PANEL ────────────────────────────────────── */
    .left-panel{width:510px;flex-shrink:0;padding:24px 22px 24px 40px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);position:relative;z-index:2;}

    h1{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:0;opacity:0;animation:fade-up .5s ease forwards .12s;}
    h1 em{font-style:normal;color:#6fe9da;}
    .subtitle{font-size:14px;color:rgba(255,255,255,.5);margin-top:8px;font-weight:400;line-height:1.4;opacity:0;animation:fade-up .5s ease forwards .18s;}

    /* ── ACCORDION ─────────────────────────────────────── */
    .select-hint{font-size:14px;color:rgba(255,255,255,.5);margin-top:14px;font-family:"JetBrains Mono",monospace;letter-spacing:.04em;transition:opacity .3s;}

    .accordion{margin-top:10px;display:flex;flex-direction:column;gap:8px;}

    .accord-item{display:flex;flex-direction:column;}
    .accord-body{max-height:0;overflow:hidden;transition:max-height .38s ease;
      background:rgba(255,255,255,.022);border-radius:0 0 8px 8px;}
    .accord-item.active .accord-body{max-height:420px;}
    .accord-item.active .algo-btn{border-bottom-left-radius:0;border-bottom-right-radius:0;}

    .accord-desc{font-size:13px;color:rgba(255,255,255,.55);font-family:"JetBrains Mono",monospace;
      letter-spacing:.03em;line-height:1.4;padding:10px 14px 2px;}

    .bullets-list{display:flex;flex-direction:column;gap:7px;overflow:hidden;padding:6px 14px 6px;}
    .bullet-item{display:flex;align-items:flex-start;gap:9px;font-size:18px;line-height:1.28;color:rgba(255,255,255,.88);}
    .bullet-item code{font-family:"JetBrains Mono",monospace;font-size:15px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:4px;}
    .b-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:8px;}

    .status-text{font-family:"JetBrains Mono",monospace;font-size:13px;color:rgba(255,255,255,.55);
      padding:4px 14px 10px;letter-spacing:.02em;min-height:18px;line-height:1.35;transition:all .2s;}

    /* ── ALGORITHM BUTTONS ─────────────────────────────── */
    .algo-btn{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;
      padding:12px 16px;font-family:"Inter",sans-serif;font-size:19px;font-weight:700;color:rgba(255,255,255,.7);
      cursor:pointer;text-align:left;letter-spacing:.01em;transition:all .18s;display:flex;align-items:center;gap:8px;}
    .algo-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);color:#fff;}
    .algo-btn.active{background:rgba(0,191,179,.12);border-color:rgba(0,191,179,.5);color:#6fe9da;}
    #btnFlat.active{background:rgba(0,191,179,.12);border-color:#00bfb3;}
    #btnHNSW.active{background:rgba(254,197,20,.1);border-color:#fec514;color:#fec514;}
    #btnDisk.active{background:rgba(147,201,14,.1);border-color:#93c90e;color:#93c90e;}
    .btn-icon{font-size:20px;flex-shrink:0;}

    /* ── RIGHT PANEL / CANVAS ──────────────────────────── */
    .right-panel{flex:1;position:relative;overflow:hidden;}
    #canvas3d{width:100%;height:100%;display:block;}

    /* Axis labels */
    .ax-label{position:absolute;font-family:"JetBrains Mono",monospace;font-size:13px;
      font-weight:600;color:rgba(255,255,255,.4);pointer-events:none;letter-spacing:.1em;
      text-transform:uppercase;}

    /* Query point label (2D mode) */
    #queryLabel{position:absolute;display:none;font-family:"JetBrains Mono",monospace;
      font-size:14px;font-weight:700;color:#ff6060;letter-spacing:.16em;text-transform:uppercase;
      pointer-events:none;white-space:nowrap;
      transform:translate(-50%,calc(-100% - 7px));
      text-shadow:0 0 10px rgba(255,80,80,.55);}

    #qcap{position:absolute;left:24px;top:20px;font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500;color:rgba(255,255,255,.6);opacity:0;transition:opacity .4s;pointer-events:none;max-width:520px;line-height:1.35;}
    #qcap.on{opacity:1;}
    /* Elastic logo + meta */
    .elastic-logo{position:absolute;bottom:16px;right:28px;display:flex;align-items:center;gap:7px;opacity:0;animation:fade-up .5s ease forwards .5s;}
  </style>
</head>
<body>
<div class="slide">
  <!-- ── LEFT PANEL ── -->
  <div class="left-panel">
    <h1>Three Elasticsearch Vector Indexing <em>Algorithms</em></h1>
    <div class="subtitle">416 text chunks · 1,024-dim Jina v5 embeddings<br>simplified 3D projection</div>

    <div class="select-hint" id="selectHint">⬇ Pick an algorithm to watch it run</div>

    <div class="accordion">
      <div class="accord-item" id="itemFlat">
        <button class="algo-btn" id="btnFlat"><span class="btn-icon">⚡</span>Flat (exact)</button>
        <div class="accord-body">
          <div class="accord-desc" id="descFlat"></div>
          <div class="bullets-list" id="bulletsFlat"></div>
          <div class="status-text" id="statusFlat"></div>
        </div>
      </div>
      <div class="accord-item" id="itemHNSW">
        <button class="algo-btn" id="btnHNSW"><span class="btn-icon">🕸</span>Quantized HNSW</button>
        <div class="accord-body">
          <div class="accord-desc" id="descHNSW"></div>
          <div class="bullets-list" id="bulletsHNSW"></div>
          <div class="status-text" id="statusHNSW"></div>
        </div>
      </div>
      <div class="accord-item" id="itemDisk">
        <button class="algo-btn" id="btnDisk"><span class="btn-icon">💾</span>DiskBBQ</button>
        <div class="accord-body">
          <div class="accord-desc" id="descDisk"></div>
          <div class="bullets-list" id="bulletsDisk"></div>
          <div class="status-text" id="statusDisk"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── RIGHT PANEL / THREE.JS ── -->
  <div class="right-panel">
    <canvas id="canvas3d"></canvas>
    <div id="queryLabel">query</div>
    <div id="qcap">Red dot = the query: &ldquo;how do I make search results more relevant&rdquo;</div>
  </div>
</div>

<!-- ── ELASTIC LOGO + META ── -->
<div class="elastic-logo">

</div>

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function easeInOut(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; }

// Cancellable delay
function delay(ms) {
  return new Promise(resolve => {
    const id = setTimeout(resolve, ms);
    animTimers.push(id);
  });
}

// Clear all pending timers
function clearAnimTimers() {
  animTimers.forEach(clearTimeout);
  animTimers = [];
}

// Tween ALL meshes from current positions to targets over `duration` ms.
// targets: Array of THREE.Vector3 or null (skip that mesh).
function tweenPositions(targets, duration) {
  const anim = currentAnim; // capture current anim for cancel check
  return new Promise(resolve => {
    const startPos = meshes.map(m => m.position.clone());
    const t0 = performance.now();
    function tick() {
      if (currentAnim !== anim) { resolve(); return; } // animation switched
      const t = Math.min((performance.now() - t0) / duration, 1);
      const e = easeInOut(t);
      meshes.forEach((m, i) => {
        if (!targets[i]) return;
        m.position.set(
          startPos[i].x + (targets[i].x - startPos[i].x) * e,
          startPos[i].y + (targets[i].y - startPos[i].y) * e,
          startPos[i].z + (targets[i].z - startPos[i].z) * e
        );
      });
      if (t < 1) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });
}

// Reset all meshes to natural UMAP positions
function resetToNatural(duration = 900) {
  meshes.forEach(m => {
    m.material.color.setHex(VECTOR_COLOR);
    m.material.opacity = 0.72;
  });
  return tweenPositions(naturalPos, duration);
}

// Remove all animation objects from animLayer
function clearAnimLayer() {
  while (animLayer.children.length) {
    const obj = animLayer.children[0];
    obj.geometry?.dispose();
    obj.material?.dispose();
    animLayer.remove(obj);
  }
  animDashMats.length = 0;
  hideQueryLabel();
}

  return s ? document.getElementById(s[key]) : null;

function clearBullets() {

  document.getElementById(s.bullets).innerHTML = '';

// Add one bullet item asynchronously (with optional delay before showing)
function addBullet(text, color = '#6fe9da', delayMs = 0) {
  return new Promise(resolve => {
    const id = setTimeout(() => {
      const container = getEl('bullets');
      if (!container) { resolve(); return; }
      const div = document.createElement('div');
      div.className = 'bullet-item';
      const dot = document.createElement('span');
      dot.className = 'b-dot';
      dot.style.background = color;
      const txt = document.createElement('span');
      txt.innerHTML = text;
      div.append(dot, txt);
      div.style.cssText = 'opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;';
      container.appendChild(div);
      requestAnimationFrame(() => {
        div.style.opacity = '1';
        div.style.transform = 'none';
      });
      resolve();
    }, delayMs);
    animTimers.push(id);
  });
}

// ── Geometry factory helpers ───────────────────────────────────
function makeLine(from, to, color, opacity = 0.5) {
  const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const mat = new THREE.LineBasicMaterial({color, transparent: true, opacity});
  return new THREE.Line(geo, mat);
}

// Animated dashed line between two scene-local positions.
// The material is registered in animDashMats so the render loop marches the dashes.
// IMPORTANT: computeLineDistances() must be called on the Line object (not the geometry)
// so that Three.js writes the correct lineDistance attribute before the first draw.
function makeDashedLine(from, to, color) {
  const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const mat = new THREE.LineDashedMaterial({
    color, dashSize: 0.06, gapSize: 0.035, transparent: true, opacity: 0.88,
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();  // must be on the Line, not the geometry
  animDashMats.push(mat);
  return line;
}

// Convert a scene-local position to canvas pixel coordinates.
function sceneLocalToScreen(localPos) {
  const θ = sceneYRot;
  const sinθ = Math.sin(θ), cosθ = Math.cos(θ);
  // Apply frozen scene Y rotation to get world coords
  const wx = localPos.x * cosθ + localPos.z * sinθ;
  const wy = localPos.y;
  const wz = -localPos.x * sinθ + localPos.z * cosθ;
  const ndc = new THREE.Vector3(wx, wy, wz).project(camera);
  return {
    x: (ndc.x * 0.5 + 0.5) * canvas3d.clientWidth,
    y: (-ndc.y * 0.5 + 0.5) * canvas3d.clientHeight,
  };
}

const queryLabelEl = document.getElementById('queryLabel');
function showQueryLabel(sceneLocalPos) {
  const {x, y} = sceneLocalToScreen(sceneLocalPos);
  queryLabelEl.style.left = x + 'px';
  queryLabelEl.style.top  = y + 'px';
  queryLabelEl.style.display = 'block';
}
function hideQueryLabel() {

}

// Tween camera position + sceneYRot simultaneously.
// Optional lookAtTarget: slerps camera orientation toward that world point.
function tweenCamera(targetPos, targetYRot, duration, lookAtTarget = null) {
  const anim = currentAnim;
  return new Promise(resolve => {
    const startPos = camera.position.clone();
    const startQuat = camera.quaternion.clone();
    const startYRot = sceneYRot;
    // Pre-compute end quaternion if a lookAt target was supplied
    let endQuat = null;
    if (lookAtTarget) {
      const tmp = camera.clone();
      tmp.position.copy(targetPos);
      tmp.lookAt(lookAtTarget);
      endQuat = tmp.quaternion.clone();
    }
    const t0 = performance.now();
    function tick() {
      if (currentAnim !== anim) { resolve(); return; }
      const t = Math.min((performance.now() - t0) / duration, 1);
      const e = easeInOut(t);
      camera.position.set(
        startPos.x + (targetPos.x - startPos.x) * e,
        startPos.y + (targetPos.y - startPos.y) * e,
        startPos.z + (targetPos.z - startPos.z) * e
      );
      if (targetYRot !== null) sceneYRot = startYRot + (targetYRot - startYRot) * e;
      if (endQuat) camera.quaternion.slerpQuaternions(startQuat, endQuat, e);
      if (t < 1) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });
}

// ── Camera-facing 2D grid helpers ─────────────────────────────
// At the moment of entering 2D, capture the camera direction and frozen scene rotation
// so the grid/scan-box live in the plane the user is actually looking at.

// Convert (gx, gy) in grid-space to scene-local Vector3 on the camera-facing plane.
// right/up: plane basis (world space). sinθ/cosθ: frozen scene Y rotation (for world→local).
function gridLocalPos(gx, gy, right, up, sinθ, cosθ) {
  const wx = right.x*gx + up.x*gy;
  const wy = right.y*gx + up.y*gy;
  const wz = right.z*gx + up.z*gy;
  // Inverse Y rotation: world → scene local
  return new THREE.Vector3(wx*cosθ - wz*sinθ, wy, wx*sinθ + wz*cosθ);
}

// Capture camera-facing plane basis at the current camera position + sceneYRot.
// Returns { right, up, sinθ, cosθ } for use with gridLocalPos.
function captureFacingBasis() {
  const camDir = camera.position.clone().normalize();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(worldUp, camDir).normalize();
  const up = new THREE.Vector3().crossVectors(camDir, right).normalize();
  const θ = sceneYRot;
  return { right, up, sinθ: Math.sin(θ), cosθ: Math.cos(θ) };
}

// Sweeping bounding box (LineLoop, corners in camera-facing grid coordinates)
function makeScanBox(gxMin, gxMax, gyLo, gyHi, basis) {
  const {right, up, sinθ, cosθ} = basis;
  const corners = [
    gridLocalPos(gxMin, gyLo, right, up, sinθ, cosθ),
    gridLocalPos(gxMax, gyLo, right, up, sinθ, cosθ),
    gridLocalPos(gxMax, gyHi, right, up, sinθ, cosθ),
    gridLocalPos(gxMin, gyHi, right, up, sinθ, cosθ),
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(corners);
  const mat = new THREE.LineBasicMaterial({color: 0x00e5ff, transparent: true, opacity: 0.85});
  return new THREE.LineLoop(geo, mat);
}

function updateScanBox(box, gxMin, gxMax, gyLo, gyHi, basis) {
  const {right, up, sinθ, cosθ} = basis;
  const pos = box.geometry.attributes.position;
  const pts = [
    gridLocalPos(gxMin, gyLo, right, up, sinθ, cosθ),
    gridLocalPos(gxMax, gyLo, right, up, sinθ, cosθ),
    gridLocalPos(gxMax, gyHi, right, up, sinθ, cosθ),
    gridLocalPos(gxMin, gyHi, right, up, sinθ, cosθ),
  ];
  pts.forEach(({x,y,z}, i) => pos.setXYZ(i, x, y, z));
  pos.needsUpdate = true;
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION: FLAT INDEXING
// Camera locks straight-on. Points flatten to index-ordered 2D
// grid. Sweeping bounding box scans all rows. Top-K scattered.
// ═══════════════════════════════════════════════════════════════
async function startFlatAnimation() {
  const anim = 'flat';
  setMode('Flat Indexing', 'Brute force · exact results');
  // keep auto-rotating until camera locks in step 2

  // ── Step 1: Flatten to index-ordered 2D grid ────────────────
  await addBullet('① Vectors are stored as-is: no graph, no clusters', '#6fe9da');
  await delay(400);

  // Freeze scene where it is — no camera tween, no sceneYRot reset.
  autoRotating = false;
  orbitEnabled = false;
  axisGroup.visible = false;

  const COLS = 26;
  const rows = Math.ceil(N / COLS);
  const GRID_W = 2.2, GRID_H = 1.3;
  const ROW_H = GRID_H / (rows - 1);

  const flatBasis = captureFacingBasis();
  const gridTargets = naturalPos.map((_, i) => {
    const col = i % COLS, row = Math.floor(i / COLS);
    const gx = -GRID_W/2 + col * (GRID_W / (COLS - 1));
    const gy = GRID_H/2 - row * ROW_H;
    return gridLocalPos(gx, gy, flatBasis.right, flatBasis.up, flatBasis.sinθ, flatBasis.cosθ);
  });
  await tweenPositions(gridTargets, 900);
  if (currentAnim !== anim) return;
  setStatus('Each dot is one chunk, laid out in a grid');
  await delay(300);

  // ── Step 2: Pre-filter (now visible in 2D) ──────────────────
  if (currentAnim !== anim) return;
  await addBullet('② Pre-filter: <code>WHERE</code> drops non-matching docs first', '#6fe9da');
  await delay(200);

  const filtered = new Set();
  meshes.forEach((m, i) => {
    // Deterministic pseudo-random per index — no modulo stripes in the grid
    const r = Math.abs(Math.sin(i * 127.1 + 311.7) * 43758.5453) % 1;
    if (r < 0.35) {
      filtered.add(i);
      m.material.color.setHex(FILTERED_COLOR);
      m.material.opacity = 0.15;
    }
  });
  setStatus(`${filtered.size} chunks filtered out · ${N - filtered.size} remain to score`);
  await delay(500);

  // ── Step 3: Sweeping scan bounding box ─────────────────────
  if (currentAnim !== anim) return;
  await addBullet('③ Score every remaining vector against the query', '#6fe9da');

  // Query marker — centered above the grid, labeled "search vector"
  const flatQueryPos = gridLocalPos(0, GRID_H/2 + 0.2, flatBasis.right, flatBasis.up, flatBasis.sinθ, flatBasis.cosθ);
  const queryPt = new THREE.Mesh(
    new THREE.SphereGeometry(0.038, 12, 12),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.95})
  );
  queryPt.position.copy(flatQueryPos);
  animLayer.add(queryPt);
  const qRing = new THREE.Mesh(
    new THREE.RingGeometry(0.055, 0.072, 24),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.4, side: THREE.DoubleSide})
  );
  qRing.position.copy(flatQueryPos);
  qRing.lookAt(camera.position);
  animLayer.add(qRing);
  showQueryLabel(flatQueryPos);
  setStatus('Query vector placed (red) · scoring starts');
  await delay(300);

  // Pre-compute top-K so hits light up gold as the bounding box sweeps over them
  const qRef = QUERY;
  const scored = POINTS.map(([x,y,z], i) => ({
    i, d: filtered.has(i) ? Infinity : (x-qRef[0])**2+(y-qRef[1])**2+(z-qRef[2])**2
  })).sort((a,b) => a.d - b.d);
  const topKSet = new Set(scored.slice(0, 10).map(o => o.i));

  // Scan box sweeps row by row
  const boxHalfH = ROW_H * 0.65;
  const scanBox = makeScanBox(
    -GRID_W/2 - 0.06, GRID_W/2 + 0.06,
    GRID_H/2 - boxHalfH, GRID_H/2 + boxHalfH,
    flatBasis
  );
  animLayer.add(scanBox);

  const SHOW_ROWS = 9;
  for (let r = 0; r < rows; r++) {
    if (currentAnim !== anim) return;
    const cy = GRID_H/2 - r * ROW_H;
    updateScanBox(scanBox,
      -GRID_W/2 - 0.06, GRID_W/2 + 0.06,
      cy - boxHalfH, cy + boxHalfH,
      flatBasis
    );
    const start = r * COLS, end = Math.min(start + COLS, N);
    for (let i = start; i < end; i++) {
      if (!filtered.has(i)) {
        if (topKSet.has(i)) {
          meshes[i].material.color.setHex(HIT_COLOR);  // reveal hit immediately
          meshes[i].material.opacity = 1.0;
        } else {
          meshes[i].material.color.setHex(VECTOR_COLOR);
          meshes[i].material.opacity = 0.38;  // scored, not a hit
        }
      }
    }
    if (r < SHOW_ROWS) {
      setStatus(`Scoring row ${r + 1}/${rows} · indices ${start}–${end - 1}`);
      await delay(100);
    } else {
      await delay(12);
    }
  }
  setStatus(`All ${rows} rows scored · ${N - filtered.size} vectors compared`);
  await delay(300);

  // ── Step 4: Top-K scattered across grid ─────────────────────
  if (currentAnim !== anim) return;
  await addBullet('④ Sort the scores → the exact top-k', '#00ff88');

  // Hits already revealed gold during sweep — just add rings and highlight scanBox
  scanBox.material.color.setHex(HIT_COLOR);
  scanBox.material.opacity = 0.2;

  [...topKSet].forEach(i => {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.04, 0.057, 16),
      new THREE.MeshBasicMaterial({color: HIT_COLOR, transparent: true, opacity: 0.75, side: THREE.DoubleSide})
    );
    ring.position.copy(meshes[i].position);
    ring.lookAt(camera.position);
    animLayer.add(ring);
    animLayer.add(makeDashedLine(meshes[i].position, flatQueryPos, HIT_COLOR));
  });
  setStatus(`Top-${topKSet.size} results ✓ · exact: nothing missed`);
  await delay(600);

}

// ═══════════════════════════════════════════════════════════════
// ANIMATION: HNSW
// Edges appear, then greedy traversal shows GREEN for chosen hops
// and RED for every rejected neighbor path at each step.
// ═══════════════════════════════════════════════════════════════
async function startHNSWAnimation() {
  const anim = 'hnsw';
  setMode('HNSW (+ BBQ)',
          'Graph-based · approximate · fast while the graph fits in RAM');
  // keep auto-rotating while the graph builds

  // ── Step 1: Show graph edges ────────────────────────────────
  await addBullet('① Build: each vector links to its nearest neighbors', '#fec514');
  await delay(300);

  const EDGE_BATCH = 40;
  for (let b = 0; b * EDGE_BATCH < EDGES.length; b++) {
    if (currentAnim !== anim) return;
    EDGES.slice(b * EDGE_BATCH, (b+1) * EDGE_BATCH).forEach(([i,j]) => {
      animLayer.add(makeLine(meshes[i].position, meshes[j].position, 0x1a2f55, 0.18));
    });
    await delay(14);
  }
  setStatus(`${EDGES.length} neighbor links drawn (k=4 per chunk)`);
  await delay(400);

  // ── Step 2: Highlight the most-connected hub nodes ──────────
  if (currentAnim !== anim) return;
  await addBullet('② A few well-connected nodes act as shortcuts', '#fec514');

  const degree = Array(N).fill(0);
  EDGES.forEach(([i,j]) => { degree[i]++; degree[j]++; });
  const byDegree = [...degree].map((d,i)=>[d,i]).sort((a,b)=>b[0]-a[0]);
  // Brighten top-20 hubs in place — no position change
  byDegree.slice(0,20).forEach(([,i]) => {
    meshes[i].material.color.setHex(0xffffff);
    meshes[i].material.opacity = 1.0;
  });
  setStatus('White = the most-connected nodes (hubs)');
  await delay(700);

  // ── Step 3: Traversal — green path + red rejections ─────────
  if (currentAnim !== anim) return;
  // Scene keeps rotating — traversal lines ride with it, stays readable
  await addBullet('③ Walk toward the query: green = hop taken, red = rejected', '#fec514');

  const TARGET = QUERY;

  // Entry point is a high-degree hub node — pick the one farthest from target
  // so the traversal path is long and clearly visible
  const hubIndices = byDegree.slice(0, 20).map(([,i]) => i);
  let entryIdx = hubIndices[0], maxHubDist2 = 0;
  hubIndices.forEach(i => {
    const [x,y,z] = POINTS[i];
    const d = (x-TARGET[0])**2 + (y-TARGET[1])**2 + (z-TARGET[2])**2;
    if (d > maxHubDist2) { maxHubDist2 = d; entryIdx = i; }
  });

  // Place query marker
  const queryMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 12, 12),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.9})
  );
  queryMesh.position.set(TARGET[0]*SC, TARGET[1]*SC*0.6, TARGET[2]*SC);
  animLayer.add(queryMesh);
  setStatus('Query (red) · picking a hub to start from…');
  await delay(400);

  // Cycle orange briefly through hub candidates — shows algorithm picking from the hub set
  const hubCandidates = hubIndices.filter(i => i !== entryIdx).slice(0, 5);
  for (const ci of hubCandidates) {
    if (currentAnim !== anim) return;
    meshes[ci].material.color.setHex(0xff9900);
    meshes[ci].material.opacity = 1.0;
    await delay(130);
    meshes[ci].material.color.setHex(0xffffff);
    meshes[ci].material.opacity = 1.0;
  }
  // Settle on chosen entry hub
  meshes[entryIdx].material.color.setHex(0xff9900);
  meshes[entryIdx].material.opacity = 1.0;
  setStatus(`Start node ${entryIdx} (orange) · greedy walk begins`);
  await delay(400);

  // Greedy traversal with full neighbor evaluation shown
  const visited = new Set([entryIdx]);
  let current = entryIdx;
  const pathNodes = [entryIdx];
  const MAX_HOPS = 18;
  let hopCount = 0;

  for (let hop = 0; hop < MAX_HOPS; hop++) {
    if (currentAnim !== anim) return;

    const neighbors = adj[current].filter(n => !visited.has(n));
    if (neighbors.length === 0) break;

    // Score all neighbors, find best
    let bestN = -1, bestD = Infinity;
    neighbors.forEach(n => {
      const [x,y,z] = POINTS[n];
      const d = (x-TARGET[0])**2 + (y-TARGET[1])**2 + (z-TARGET[2])**2;
      if (d < bestD) { bestD = d; bestN = n; }
    });
    if (bestN < 0) break;

    // RED lines to all rejected neighbors
    let rejCount = 0;
    neighbors.forEach(n => {
      if (n !== bestN) {
        animLayer.add(makeLine(meshes[current].position, meshes[n].position, 0xff2020, 0.55));
        if (!pathNodes.includes(n)) {
          meshes[n].material.color.setHex(0x5a0000);
          meshes[n].material.opacity = 0.55;
        }
        rejCount++;
      }
    });

    // GREEN line to chosen neighbor
    animLayer.add(makeLine(meshes[current].position, meshes[bestN].position, 0x00ff88, 0.95));
    meshes[bestN].material.color.setHex(0x00ff88);
    meshes[bestN].material.opacity = 1.0;

    if (hop > 0) {
      meshes[current].material.color.setHex(0x007744);
      meshes[current].material.opacity = 0.65;
    }

    visited.add(bestN);
    pathNodes.push(bestN);

    const dist = Math.sqrt(
      (POINTS[bestN][0]-TARGET[0])**2+(POINTS[bestN][1]-TARGET[1])**2+(POINTS[bestN][2]-TARGET[2])**2
    ).toFixed(3);
    const rejLabel = rejCount > 0 ? ` · ${rejCount} path${rejCount > 1 ? 's' : ''} rejected (red)` : '';
    setStatus(`Hop ${hop+1}: node ${bestN}${rejLabel} · dist=${dist}`);

    current = bestN;
    hopCount++;
    await delay(200);
  }

  // Final top-K
  if (currentAnim !== anim) return;
  await addBullet('④ BBQ: oversample 3×, rescore the candidates → top-k', '#fec514');
  const dists = POINTS.map(([x,y,z], i) => [i, (x-TARGET[0])**2+(y-TARGET[1])**2+(z-TARGET[2])**2]);
  dists.sort((a,b) => a[1]-b[1]);
  dists.slice(0,5).map(([i])=>i).forEach(i => {
    meshes[i].material.color.setHex(HIT_COLOR);
    meshes[i].material.opacity = 1.0;
    // Dashed line from hit dot to query sphere in 3D (both in scene-local space)
    animLayer.add(makeDashedLine(meshes[i].position, queryMesh.position, HIT_COLOR));
  });
  setStatus(`${hopCount} hops · ${visited.size} nodes visited, not all ${N} · top-5 found ✓`);
  await delay(400);

}

// ═══════════════════════════════════════════════════════════════
// ANIMATION: DISKBBQ
// Stays in 3D. ConvexGeometry hulls per cluster (Voronoi regions).
// Centroid scoring brightens hulls. Winning clusters identified.
// Points then collapse to mini-grid + sweep (like flat indexing).
// ═══════════════════════════════════════════════════════════════
async function startDiskBBQAnimation() {
  const anim = 'disk';
  setMode('DiskBBQ',
          'Cluster-based · approximate · vectors stay on disk');
  // keep auto-rotating through hull build and centroid scoring

  // ── Step 1: Color by cluster + build 3D convex hull Voronoi ─
  await addBullet('① Hierarchical k-means groups vectors into clusters', '#93c90e');
  await delay(300);

  // Points stay VECTOR_COLOR — cluster identity is shown by the hull geometry
  await delay(400);

  // Build semi-transparent convex hull for each cluster
  const hullData = []; // {ci, hullMesh, hullMat, edgeMesh, edgeMat}
  for (let ci = 0; ci < 7; ci++) {
    const memberPts = [];
    POINTS.forEach(([x,y,z,cl], i) => {
      if (cl === ci) memberPts.push(meshes[i].position.clone());
    });
    if (memberPts.length < 4) continue;
    try {
      const geo = new ConvexGeometry(memberPts);
      const hullMat = new THREE.MeshBasicMaterial({
        color: CLUSTER_HEX[ci], transparent: true, opacity: 0,
        side: THREE.DoubleSide, depthWrite: false,
      });
      const hullMesh = new THREE.Mesh(geo, hullMat);
      animLayer.add(hullMesh);
      const edgeGeo = new THREE.EdgesGeometry(geo);
      const edgeMat = new THREE.LineBasicMaterial({
        color: CLUSTER_HEX[ci], transparent: true, opacity: 0,
      });
      const edgeMesh = new THREE.LineSegments(edgeGeo, edgeMat);
      animLayer.add(edgeMesh);
      hullData.push({ci, hullMesh, hullMat, edgeMesh, edgeMat});
    } catch(e) { /* skip degenerate clusters */ }
  }

  // Place query dot BEFORE hulls appear so user sees what we're searching for
  const qTarget = QUERY;
  const qMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 12, 12),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.95})
  );
  qMesh.position.set(qTarget[0]*SC, qTarget[1]*SC*0.6, qTarget[2]*SC);
  animLayer.add(qMesh);
  const qRing = new THREE.Mesh(
    new THREE.RingGeometry(0.07, 0.09, 24),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.4, side: THREE.DoubleSide})
  );
  qRing.position.copy(qMesh.position);
  animLayer.add(qRing);
  setStatus('Query vector placed (red) · grouping the space into clusters…');
  await delay(500);

  // Fade in hulls one by one
  for (const {ci, hullMat, edgeMat} of hullData) {
    if (currentAnim !== anim) return;
    hullMat.opacity = 0.07;
    edgeMat.opacity = 0.28;
    await delay(70);
  }
  setStatus('7 clusters (shown as 3D hulls)');
  await delay(600);

  // ── Step 2: each cluster has a centroid; every vector joins its nearest one ──
  if (currentAnim !== anim) return;
  await addBullet('② Each cluster has a centroid (white diamond)', '#93c90e');

  CENTROIDS.forEach(([cx,cy,cz], ci) => {
    const cm = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.06),
      new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.95})
    );
    cm.position.set(cx*SC, cy*SC*0.6, cz*SC);
    animLayer.add(cm);
  });
  setStatus('7 centroids · each vector belongs to its nearest');
  await delay(1000);

  // ── Step 3: Place query + score centroids (hulls pulse) ─────
  if (currentAnim !== anim) return;
  await addBullet('③ Query: find the nearest centroids', '#93c90e');

  setStatus('Scoring the 7 centroids…');
  await delay(400);

  const centDists = CENTROIDS.map(([cx,cy,cz], ci) => ({
    ci,
    d: Math.sqrt((qTarget[0]-cx)**2+(qTarget[1]-cy)**2+(qTarget[2]-cz)**2)
  })).sort((a,b) => a.d - b.d);
  const winSet = new Set([centDists[0].ci, centDists[1].ci]);

  for (const {ci, d} of centDists) {
    if (currentAnim !== anim) return;
    const hd = hullData.find(h => h.ci === ci);
    if (hd) { hd.hullMat.opacity = 0.22; hd.edgeMat.opacity = 0.8; }
    setStatus(`Centroid ${ci} · distance ${d.toFixed(3)}`);
    await delay(160);
    if (!winSet.has(ci) && hd) { hd.hullMat.opacity = 0.04; hd.edgeMat.opacity = 0.12; }
  }

  // Winning clusters stay bright; all others fade to zero — just 2 hulls visible
  winSet.forEach(ci => {
    const hd = hullData.find(h => h.ci === ci);
    if (hd) { hd.hullMat.opacity = 0.18; hd.edgeMat.opacity = 0.9; }
  });
  hullData.forEach(({ci, hullMat, edgeMat}) => {
    if (!winSet.has(ci)) { hullMat.opacity = 0; edgeMat.opacity = 0; }
  });
  setStatus(`Nearest: clusters ${[...winSet].join(' and ')} · only these get searched`);
  await delay(2000);  // pause — let user see exactly which 2 hulls remain

  // ── Step 4: Flatten winning points + sweep like flat ────────
  if (currentAnim !== anim) return;
  await addBullet('④ Compare only the vectors in those clusters', '#93c90e');

  // Dim non-winning points and hulls
  meshes.forEach((m, i) => {
    if (!winSet.has(POINTS[i][3])) { m.material.color.setHex(FILTERED_COLOR); m.material.opacity = 0.12; }
  });
  hullData.forEach(({ci, hullMat, edgeMat}) => {
    if (!winSet.has(ci)) { hullMat.opacity = 0.02; edgeMat.opacity = 0.05; }
  });
  await delay(300);

  const winPoints = POINTS.map((p,i) => winSet.has(p[3]) ? i : -1).filter(i => i >= 0);
  const MINI_COLS = Math.min(winPoints.length, 14);
  const MINI_ROWS = Math.ceil(winPoints.length / MINI_COLS);
  const MINI_W = 1.9, MINI_H = 1.1;
  const MINI_ROW_H = MINI_H / Math.max(1, MINI_ROWS - 1);

  // Pre-compute top-K so hits light up gold as the bounding box sweeps over them
  const diskDists = winPoints.map(i => {
    const [x,y,z] = POINTS[i];
    return {i, d: (x-qTarget[0])**2+(y-qTarget[1])**2+(z-qTarget[2])**2};
  }).sort((a,b) => a.d - b.d);
  const diskTopKSet = new Set(diskDists.slice(0,8).map(o => o.i));

  // Freeze scene where it is — no camera tween, no sceneYRot reset.
  // Capture camera-facing plane basis now, before stopping rotation.
  const diskBasis = captureFacingBasis();
  autoRotating = false;
  orbitEnabled = false;

  // Compute mini-grid in the camera-facing plane
  const miniTargets = naturalPos.map(() => null);
  winPoints.forEach((idx, k) => {
    const col = k % MINI_COLS, row = Math.floor(k / MINI_COLS);
    const gx = -MINI_W/2 + col * (MINI_W / Math.max(1, MINI_COLS - 1));
    const gy = MINI_H/2 - row * MINI_ROW_H;
    miniTargets[idx] = gridLocalPos(gx, gy, diskBasis.right, diskBasis.up, diskBasis.sinθ, diskBasis.cosθ);
  });

  // Remove all 3D overlay objects (hulls, lines, query), hide axes + grid
  clearAnimLayer();
  axisGroup.visible = false;

  await tweenPositions(miniTargets, 900);
  if (currentAnim !== anim) return;
  setStatus(`${winPoints.length} of ${N} vectors to compare · the rest are never read`);
  await delay(300);

  // Red query marker centered above the 2D mini-grid, labeled "search vector"
  const diskQueryPos = gridLocalPos(0, MINI_H/2 + 0.2, diskBasis.right, diskBasis.up, diskBasis.sinθ, diskBasis.cosθ);
  const diskQMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.038, 12, 12),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.95})
  );
  diskQMesh.position.copy(diskQueryPos);
  animLayer.add(diskQMesh);
  const diskQRing = new THREE.Mesh(
    new THREE.RingGeometry(0.055, 0.072, 24),
    new THREE.MeshBasicMaterial({color: 0xff3333, transparent: true, opacity: 0.4, side: THREE.DoubleSide})
  );
  diskQRing.position.copy(diskQueryPos);
  diskQRing.lookAt(camera.position);
  animLayer.add(diskQRing);
  showQueryLabel(diskQueryPos);

  // Sweep bounding box over mini-grid
  const boxHalfH = MINI_ROW_H * 0.65;
  const miniScanBox = makeScanBox(
    -MINI_W/2 - 0.07, MINI_W/2 + 0.07,
    MINI_H/2 - boxHalfH, MINI_H/2 + boxHalfH,
    diskBasis
  );
  animLayer.add(miniScanBox);

  for (let r = 0; r < MINI_ROWS; r++) {
    if (currentAnim !== anim) return;
    const cy = MINI_H/2 - r * MINI_ROW_H;
    updateScanBox(miniScanBox,
      -MINI_W/2 - 0.07, MINI_W/2 + 0.07,
      cy - boxHalfH, cy + boxHalfH,
      diskBasis
    );
    const start = r * MINI_COLS, end = Math.min(start + MINI_COLS, winPoints.length);
    for (let k = start; k < end; k++) {
      const i = winPoints[k];
      if (diskTopKSet.has(i)) {
        meshes[i].material.color.setHex(HIT_COLOR);  // reveal hit immediately
        meshes[i].material.opacity = 1.0;
      } else {
        meshes[i].material.color.setHex(0x00e5ff);  // cyan flash for non-hits
        meshes[i].material.opacity = 0.85;
      }
    }
    await delay(r < 4 ? 130 : 30);
    for (let k = start; k < end; k++) {
      const i = winPoints[k];
      if (!diskTopKSet.has(i)) {
        meshes[i].material.color.setHex(VECTOR_COLOR);
        meshes[i].material.opacity = 0.38;  // scored, not a hit
      }
      // hits remain gold — don't reset them
    }
  }

  // Top-K from winning clusters — hits already gold, just add rings + highlight scanBox
  if (currentAnim !== anim) return;
  await addBullet('⑤ Top-k comes from those clusters only', '#93c90e');
  miniScanBox.material.color.setHex(HIT_COLOR);
  miniScanBox.material.opacity = 0.22;
  [...diskTopKSet].forEach(i => {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.04, 0.057, 16),
      new THREE.MeshBasicMaterial({color:HIT_COLOR, transparent:true, opacity:0.7, side:THREE.DoubleSide})
    );
    ring.position.copy(meshes[i].position);
    ring.lookAt(camera.position);
    animLayer.add(ring);
    animLayer.add(makeDashedLine(meshes[i].position, diskQueryPos, HIT_COLOR));
  });
  setStatus(`Top-${diskTopKSet.size} results ✓ · found without scanning everything`);
  await delay(500);

}

// ═══════════════════════════════════════════════════════════════
// BUTTON HANDLERS
// ═══════════════════════════════════════════════════════════════
const btnFlat = document.getElementById('btnFlat');
const btnHNSW = document.getElementById('btnHNSW');
const btnDisk = document.getElementById('btnDisk');
const allBtns = [btnFlat, btnHNSW, btnDisk];

const ACCORD_IDS = {flat: 'itemFlat', hnsw: 'itemHNSW', disk: 'itemDisk'};

async function switchAnim(name, fn) {
  // Cancel running animation; clear old section's bullets before changing currentAnim
  clearAnimTimers();
  clearAnimLayer();
  clearBullets();
  currentAnim = name;

  // Accordion: collapse all items, expand the clicked one; fade hint
  document.querySelectorAll('.accord-item').forEach(el => el.classList.remove('active'));
  document.getElementById(ACCORD_IDS[name])?.classList.add('active');
  selectHintEl.style.opacity = '0';
  document.getElementById('qcap').classList.add('on');

  // Re-enable orbit controls + reset button states
  orbitEnabled = true;
  allBtns.forEach(b => b.classList.remove('active'));
  if (name === 'flat') btnFlat.classList.add('active');
  else if (name === 'hnsw') btnHNSW.classList.add('active');
  else if (name === 'disk') btnDisk.classList.add('active');

  // Reset points to 3D, restore 3D elements, restart auto-rotation.
  // Camera never moved — no tween needed.
  axisGroup.visible = true;
  autoRotating = true;
  await resetToNatural(700);
  if (currentAnim !== name) return;
  await fn();
}

btnFlat.addEventListener('click', () => switchAnim('flat', startFlatAnimation));
btnHNSW.addEventListener('click', () => switchAnim('hnsw', startHNSWAnimation));
btnDisk.addEventListener('click', () => switchAnim('disk', startDiskBBQAnimation));

// ═══════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════
function render() {
  requestAnimationFrame(render);
  if (autoRotating) sceneYRot += 0.004;
  scene.rotation.y = sceneYRot;
  // March dashed result lines toward the query dot
  animDashMats.forEach(m => { m.dashOffset += 0.018; });
  renderer.render(scene, camera);
}
render();
</script>
