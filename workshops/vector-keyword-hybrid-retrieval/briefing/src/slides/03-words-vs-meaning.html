<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Words vs meaning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1280px;height:720px;overflow:hidden;-webkit-font-smoothing:antialiased;}
body{background:#0a0e16;font-family:"Inter",sans-serif;color:#fff;position:relative;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(ellipse 900px 600px at 50% 40%,rgba(0,191,179,.07) 0%,transparent 70%),radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:auto,32px 32px;}
@keyframes fade-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(0,191,179,.55);}50%{box-shadow:0 0 0 9px rgba(0,191,179,0);}}
.slide{width:1280px;height:720px;position:relative;z-index:1;padding:34px 50px 62px;display:flex;flex-direction:column;}
h1{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:7px;opacity:0;animation:fade-up .5s ease forwards .14s;}
h1 em{font-style:normal;color:#6fe9da;}
.sub{font-size:18px;color:rgba(255,255,255,.52);margin-top:6px;font-weight:400;opacity:0;animation:fade-up .5s ease forwards .22s;}
.mono{font-family:"JetBrains Mono",monospace;}
.lbl{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);}
code,.code{font-family:"JetBrains Mono",monospace;}
.btn{font-family:"Inter",sans-serif;font-size:17px;font-weight:800;color:#6fe9da;cursor:pointer;
  background:linear-gradient(135deg,rgba(0,191,179,.22),rgba(0,191,179,.08));border:1.5px solid rgba(0,191,179,.6);
  border-radius:999px;padding:10px 24px;transition:background .15s,box-shadow .15s,transform .08s,opacity .2s,border-color .2s;white-space:nowrap;}
.btn:hover{background:rgba(0,191,179,.3);box-shadow:0 0 18px rgba(0,191,179,.35);}
.btn:active{transform:scale(.97);}
.btn.next{animation:pulse-ring 1.8s ease-in-out infinite;}
.btn.done{opacity:.6;animation:none;}
.btn.y{color:#fec514;background:linear-gradient(135deg,rgba(254,197,20,.2),rgba(254,197,20,.06));border-color:rgba(254,197,20,.6);}
.btn.y:hover{background:rgba(254,197,20,.28);box-shadow:0 0 18px rgba(254,197,20,.3);}
.btn.p{color:#ef5098;background:linear-gradient(135deg,rgba(239,80,152,.2),rgba(239,80,152,.06));border-color:rgba(239,80,152,.6);}
.btn.p:hover{background:rgba(239,80,152,.28);box-shadow:0 0 18px rgba(239,80,152,.3);}
.btn[disabled]{opacity:.3;pointer-events:none;}
.replay-btn{position:absolute;top:44px;right:50px;font-size:22px;cursor:pointer;opacity:.4;transition:opacity .2s,transform .25s;user-select:none;z-index:100;background:none;border:none;color:#fff;line-height:1;}
.replay-btn:hover{opacity:1;transform:rotate(-30deg) scale(1.2);}
.elastic-logo{position:absolute;bottom:22px;left:50px;display:flex;align-items:center;gap:8px;opacity:0;animation:fade-up .5s ease forwards .5s;z-index:2;}
.elastic-logo .name{font-weight:600;font-size:16px;color:rgba(255,255,255,.88);}
.panel{border-radius:14px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.08);position:relative;}
.hide{opacity:0;pointer-events:none;}

.qcard{margin-top:12px;display:flex;align-items:center;gap:18px;padding:8px 22px;border-radius:14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.18);opacity:0;animation:fade-up .5s ease forwards .25s;}
.qcard .lbl{flex-shrink:0}
.qtext{font-size:27px;font-weight:700;letter-spacing:-.01em;flex:1}
.qmeta{font-family:"JetBrains Mono",monospace;font-size:14px;color:rgba(255,255,255,.4)}
.conts{display:flex;gap:16px;margin-top:10px;opacity:0;animation:fade-up .5s ease forwards .35s;}
.cont{flex:1;display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);position:relative;transition:border-color .3s,background .3s,box-shadow .3s;}
.cont .letter{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0}
.cont .ct{font-size:18px;font-weight:600;line-height:1.2;flex:1}
.cont .cid{font-family:"JetBrains Mono",monospace;font-size:13px;color:rgba(255,255,255,.4);display:block;margin-bottom:1px}
.cont .tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0}
.tag{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;white-space:nowrap;animation:pop .3s ease}
.tag.y{color:#fec514;background:rgba(254,197,20,.12);border:1px solid rgba(254,197,20,.4)}
.tag.t{color:#6fe9da;background:rgba(0,191,179,.12);border:1px solid rgba(0,191,179,.4)}
.tag.g{color:rgba(255,255,255,.55);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
.cols{display:flex;gap:24px;margin-top:10px;flex:1;min-height:0}
.col{flex:1;display:flex;flex-direction:column;gap:8px}
.colhead{display:flex;align-items:center;gap:14px;height:42px}
.colcap{font-size:16px;color:rgba(255,255,255,.5);font-weight:500}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:14px;padding:4px 14px;min-height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.028);position:relative;overflow:hidden;opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease,border-color .3s,box-shadow .3s;}
.row.show{opacity:1;transform:none}
.row .rk{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.row .tt{flex:1;font-size:18px;font-weight:600;line-height:1.2}
.row .sc{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;flex-shrink:0;color:rgba(255,255,255,.85)}
.row .bar{position:absolute;left:0;bottom:0;height:3px;border-radius:2px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1) .15s}
.row.win.y{border-color:rgba(254,197,20,.7);background:rgba(254,197,20,.07);box-shadow:0 0 22px rgba(254,197,20,.15)}
.row.win.y .rk{background:#fec514;color:#000}
.row.win.t{border-color:rgba(111,233,218,.7);background:rgba(0,191,179,.08);box-shadow:0 0 22px rgba(0,191,179,.18)}
.row.win.t .rk{background:#6fe9da;color:#000}
.row.gold{border-color:rgba(239,80,152,.7);background:rgba(239,80,152,.07)}
.row.gold .rk{background:#ef5098;color:#000}
.gap{font-family:"JetBrains Mono",monospace;font-size:14px;color:rgba(255,255,255,.35);text-align:center;height:10px;line-height:10px;opacity:0;transition:opacity .4s .5s}
.gap.show{opacity:1}
.ph{border:1.5px dashed rgba(255,255,255,.14);border-radius:12px;height:196px;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,.35);text-align:center;line-height:1.4;padding:0 30px}
.take{position:absolute;left:50px;right:50px;bottom:62px;text-align:center;opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.take.show{opacity:1;transform:none}
.take .big{font-size:35px;font-weight:900;letter-spacing:-.03em}
.take .big .w{color:#fec514}.take .big .m{color:#6fe9da}
.take .foot{font-size:17px;color:rgba(255,255,255,.55);margin-top:4px}
</style>
</head>
<body>
<div class="slide">
  <h1>Which doc should <em>win</em>?</h1>
  <div class="qcard"><span class="lbl">Query</span><span class="qtext" id="qtext"></span><span class="qmeta" id="qmeta"></span></div>
  <div class="conts">
    <div class="cont" id="cA"><div class="letter">A</div><div class="ct"><span class="cid" id="cAid"></span><span id="cAt"></span></div><div class="tags" id="cAtags"></div></div>
    <div class="cont" id="cB"><div class="letter">B</div><div class="ct"><span class="cid" id="cBid"></span><span id="cBt"></span></div><div class="tags" id="cBtags"></div></div>
  </div>
  <div class="cols">
    <div class="col">
      <div class="colhead"><button class="btn y next" id="bBM">Keyword (BM25)</button><span class="colcap">matches the <b style="color:#fec514">words</b></span></div>
      <div class="list" id="lBM"><div class="ph">Run the keyword search<br>and see who comes back first</div></div>
    </div>
    <div class="col">
      <div class="colhead"><button class="btn" id="bSEM">Semantic (vector)</button><span class="colcap">matches the <b style="color:#6fe9da">meaning</b></span></div>
      <div class="list" id="lSEM"><div class="ph">Run the vector search<br>and compare</div></div>
    </div>
  </div>
  <div class="take" id="take"><div class="big">BM25 finds <span class="w">words</span>. Vectors find <span class="m">meaning</span>.</div><div class="foot">The alerting doc never uses the word “notify”.</div></div>
  <button class="replay-btn" id="reset" title="Reset">🔁</button>
</div>
<div class="elastic-logo"><svg width="24" height="24" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="Elastic"><path d="M32 16.77c0-2.678-1.664-5.03-4.166-5.937a9.14 9.14 0 0 0 .162-1.718c0-5-4.057-9.048-9.035-9.048-2.92 0-5.626 1.393-7.33 3.746a4.78 4.78 0 0 0-2.935-1c-2.65 0-4.8 2.15-4.8 4.8 0 .582.108 1.15.298 1.677A6.36 6.36 0 0 0 0 15.243a6.31 6.31 0 0 0 4.179 5.951 9.02 9.02 0 0 0-.162 1.718 9.03 9.03 0 0 0 9.021 9.021c2.92 0 5.626-1.407 7.317-3.76.84.663 1.866 1.028 2.935 1.028 2.65 0 4.8-2.15 4.8-4.8 0-.582-.108-1.15-.298-1.677A6.37 6.37 0 0 0 32 16.771" fill="#fff"/><path d="M12.578 13.795l7.006 3.192 7.06-6.194a7.4 7.4 0 0 0 .149-1.555 7.91 7.91 0 0 0-7.899-7.899 7.89 7.89 0 0 0-6.505 3.435l-1.177 6.1z" fill="#fed10a"/><path d="M5.33 21.207a7.66 7.66 0 0 0-.15 1.582c0 4.37 3.557 7.912 7.926 7.912a7.92 7.92 0 0 0 6.546-3.462l1.163-6.073-1.555-2.975-7.033-3.205z" fill="#24bbb1"/><path d="M5.288 9.09l4.8 1.136 1.055-5.45c-.65-.5-1.46-.77-2.3-.77A3.79 3.79 0 0 0 5.058 7.79c0 .446.08.893.23 1.298" fill="#ef5098"/><path d="M4.87 10.238c-2.137.703-3.638 2.76-3.638 5.018 0 2.205 1.366 4.166 3.408 4.95l6.735-6.086-1.23-2.637z" fill="#17a8e0"/><path d="M20.87 27.24a3.8 3.8 0 0 0 2.286.784 3.79 3.79 0 0 0 3.787-3.787 3.82 3.82 0 0 0-.23-1.312l-4.788-1.123z" fill="#93c83e"/><path d="M21.843 20.544l5.275 1.23a5.33 5.33 0 0 0 3.638-5.031 5.29 5.29 0 0 0-3.408-4.937l-6.898 6.046z" fill="#0779a1"/></svg><span class="name">elastic</span></div>
<script>const Q="notify me when something goes wrong";const BM25=[{"id":"doc-061","t":"Container exit codes when a process is killed (OOM and signals)","s":7.33},{"id":"doc-002","t":"Troubleshoot authorization errors and role mapping","s":3.02},{"id":"doc-022","t":"Data streams in Elasticsearch","s":2.88},{"id":"doc-056","t":"Elasticsearch 9.x what's new overview","s":1.5},{"id":"doc-049","t":"Elasticsearch Watcher alerting","s":0.97}];const SEM=[{"id":"doc-049","t":"Elasticsearch Watcher alerting","s":0.75},{"id":"doc-025","t":"Troubleshoot snapshot and restore in Elasticsearch","s":0.65},{"id":"doc-042","t":"Elasticsearch circuit breaker settings","s":0.64},{"id":"doc-017","t":"Index lifecycle management overview","s":0.64},{"id":"doc-019","t":"Ingest pipelines in Elasticsearch","s":0.64}];const N=62;
const $=id=>document.getElementById(id);
const A=BM25[0], B=SEM[0]; // A = BM25 winner (doc-061), B = semantic winner (doc-049)
const goldId=B.id, wrongId=A.id;
const tOf=id=>(BM25.concat(SEM).find(r=>r.id===id)||{}).t;
$('qtext').textContent='“'+Q+'”';
$('qmeta').textContent=N+' docs in the index';
$('cAid').textContent=A.id; $('cAt').textContent=A.t;
$('cBid').textContent=B.id; $('cBt').textContent=B.t;
const done={bm:false,sem:false};
function mk(r,rank,cls,max,col){
  const d=document.createElement('div'); d.className='row '+(cls||'');
  d.innerHTML=`<div class="rk">${rank}</div><div class="tt">${r.t}</div><div class="sc">${r.s.toFixed(2)}</div><div class="bar" style="background:${col}"></div>`;
  d._w=Math.max(4,r.s/max*100); return d;
}
function fill(list,rows,gapAfter,gapText){
  list.innerHTML='';
  const els=[];
  rows.forEach(x=>{
    if(x==='gap'){const g=document.createElement('div');g.className='gap';g.textContent=gapText;list.appendChild(g);els.push(g);return;}
    list.appendChild(x);els.push(x);
  });
  els.forEach((e,i)=>setTimeout(()=>{e.classList.add('show'); const b=e.querySelector&&e.querySelector('.bar'); if(b) b.style.width=e._w+'%';},120+i*170));
}
function tag(el,cls,txt){const s=document.createElement('span');s.className='tag '+cls;s.textContent=txt;$(el).appendChild(s);}
function runBM(){
  if(done.bm)return; done.bm=true;
  const max=BM25[0].s;
  const rows=[mk(BM25[0],1,'win y',max,'#fec514'),mk(BM25[1],2,'',max,'#fec514'),mk(BM25[2],3,'',max,'#fec514'),'gap',mk(BM25[4],5,'gold',max,'#ef5098')];
  fill($('lBM'),rows,0,'⋯');
  tag('cAtags','y','BM25 #1'); 
  const r=BM25.findIndex(x=>x.id===goldId)+1; tag('cBtags','g','BM25 #'+r);
  $('bBM').classList.remove('next'); $('bBM').classList.add('done');
  $('bSEM').classList.add('next'); check();
}
function runSEM(){
  if(done.sem)return; done.sem=true;
  const max=SEM[0].s*1.0;
  const rows=[mk(SEM[0],1,'win t',max,'#6fe9da'),mk(SEM[1],2,'',max,'#6fe9da'),mk(SEM[2],3,'',max,'#6fe9da')];
  fill($('lSEM'),rows);
  tag('cBtags','t','Vector #1');
  const inTop=SEM.findIndex(x=>x.id===wrongId)>=0; if(!inTop) tag('cAtags','g','Vector: not in top '+SEM.length);
  $('bSEM').classList.remove('next'); $('bSEM').classList.add('done');
  if(!done.bm) $('bBM').classList.add('next'); check();
}
function check(){ if(done.bm&&done.sem) setTimeout(()=>$('take').classList.add('show'),900); }
$('bBM').onclick=runBM; $('bSEM').onclick=runSEM;
$('reset').onclick=()=>{
  done.bm=done.sem=false;
  $('lBM').innerHTML='<div class="ph">Run the keyword search<br>and see who comes back first</div>';
  $('lSEM').innerHTML='<div class="ph">Run the vector search<br>and compare</div>';
  $('cAtags').innerHTML='';$('cBtags').innerHTML='';
  $('take').classList.remove('show');
  ['bBM','bSEM'].forEach(i=>$(i).classList.remove('done','next')); $('bBM').classList.add('next');
};
</script>
<script>'use strict';

// Slides list is injected by the server as window.FUCKSLIDES_SLIDES
// Falls back to a single-slide no-op so slides still work opened directly
const SLIDES = window.FUCKSLIDES_SLIDES || [window.location.pathname.split('/').pop() || 'index.html'];

function currentSlideIndex() {
  const file = window.location.pathname.split('/').pop() || SLIDES[0];
  const idx  = SLIDES.indexOf(file);
  return idx === -1 ? 0 : idx;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

function saveFs() {
  if (document.fullscreenElement) sessionStorage.setItem('fs-fs', '1');
}

const inPlayer = window !== window.top;

if (inPlayer) {
  document.addEventListener('keydown', e => {
    window.parent.postMessage({ type: 'keydown', key: e.key }, '*');
  });
}

if (!inPlayer) {
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const idx = currentSlideIndex();
    if ((e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') && idx < SLIDES.length - 1) {
      e.preventDefault(); saveFs(); window.location.href = SLIDES[idx + 1];
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && idx > 0) {
      e.preventDefault(); saveFs(); window.location.href = SLIDES[idx - 1];
    }
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });
}

function injectNav() {
  const style = document.createElement('style');
  style.textContent = `
    .fs-nav { position:fixed; bottom:1.5rem; right:1.5rem; display:flex; align-items:center; gap:.25rem; z-index:9999; background:rgba(34,36,44,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12); border-radius:40px; padding:.3rem .45rem; }
    .fs-nav .nav-btn { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; color:rgba(255,255,255,.7); text-decoration:none; transition:background .15s,color .15s; cursor:pointer; }
    .fs-nav .nav-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
    .fs-nav .nav-btn svg { width:13px; height:13px; }
    .fs-nav .nav-btn--disabled { opacity:.2; pointer-events:none; }
    .fs-nav .nav-counter { font-family:'Inter',-apple-system,sans-serif; font-size:.62rem; font-weight:600; color:rgba(255,255,255,.45); letter-spacing:.06em; padding:0 .35rem; user-select:none; }
  `;
  document.head.appendChild(style);

  const idx   = currentSlideIndex();
  const chevL = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L6 8l4 5"/></svg>`;
  const chevR = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l4 5-4 5"/></svg>`;
  const fsIco = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>`;

  const prevEl = idx > 0
    ? `<a href="${SLIDES[idx - 1]}" class="nav-btn" title="Previous (←)">${chevL}</a>`
    : `<span class="nav-btn nav-btn--disabled">${chevL}</span>`;
  const nextEl = idx < SLIDES.length - 1
    ? `<a href="${SLIDES[idx + 1]}" class="nav-btn" title="Next (→)">${chevR}</a>`
    : `<span class="nav-btn nav-btn--disabled">${chevR}</span>`;

  const nav = document.createElement('nav');
  nav.className = 'fs-nav';
  nav.innerHTML = `${prevEl}<span class="nav-counter">${idx + 1}&thinsp;/&thinsp;${SLIDES.length}</span><a href="#" id="fs-fullscreen" class="nav-btn" title="Fullscreen (F)">${fsIco}</a>${nextEl}`;
  document.body.appendChild(nav);

  document.getElementById('fs-fullscreen').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
  nav.querySelectorAll('a[href]').forEach(a => a.addEventListener('click', e => { e.stopPropagation(); saveFs(); }));
}

document.addEventListener('DOMContentLoaded', () => {
  if (inPlayer) return;
  if (sessionStorage.getItem('fs-fs')) {
    sessionStorage.removeItem('fs-fs');
    document.documentElement.requestFullscreen().catch(() => {});
  }
  injectNav();
});

// Reveal on scroll
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

// Animated stat counters
function animateCounter(el) {
  const target = parseFloat(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const prefix = el.dataset.prefix || '';
  const start  = performance.now();
  const dur    = 1400;
  function step(now) {
    const ease  = 1 - Math.pow(1 - Math.min((now - start) / dur, 1), 3);
    el.textContent = prefix + (Number.isInteger(target) ? Math.round(target * ease) : (target * ease).toFixed(1)) + suffix;
    if (ease < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const counterObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !e.target.dataset.counted) {
      e.target.dataset.counted = 'true';
      animateCounter(e.target);
    }
  });
}, { threshold: 0.5 });
document.querySelectorAll('[data-target]').forEach(el => counterObserver.observe(el));
</script>
